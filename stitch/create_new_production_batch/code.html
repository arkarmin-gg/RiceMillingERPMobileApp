<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Create New Production Batch</title>
<!-- Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<!-- Material Icons -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Theme Configuration -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
            extend: {
                colors: {
                "primary": "#137fec",
                "background-light": "#f6f7f8",
                "background-dark": "#101922",
                },
                fontFamily: {
                "display": ["Inter", "sans-serif"]
                },
                borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
            },
            },
        }
    </script>
<style>
        /* Custom scrollbar hiding for clean mobile look */
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 antialiased min-h-screen flex flex-col">
<!-- Top App Bar -->
<header class="sticky top-0 z-50 bg-white/80 dark:bg-[#101922]/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800">
<div class="flex items-center justify-between px-4 h-14">
<button class="flex items-center justify-center size-10 -ml-2 rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors text-slate-900 dark:text-white">
<span class="material-symbols-outlined">arrow_back_ios_new</span>
</button>
<h1 class="text-base font-bold text-center flex-1 pr-8 truncate">Create New Production Batch</h1>
</div>
</header>
<!-- Main Content -->
<main class="flex-1 w-full max-w-lg mx-auto pb-32">
<!-- Batch Details Section -->
<div class="px-4 py-6">
<div class="flex items-center gap-2 mb-4">
<span class="material-symbols-outlined text-primary">description</span>
<h2 class="text-lg font-bold">Batch Details</h2>
</div>
<div class="bg-white dark:bg-[#1A2632] rounded-xl shadow-sm border border-slate-200 dark:border-slate-800 overflow-hidden p-4 space-y-5">
<!-- Merchant Field -->
<label class="block group">
<span class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">Select Merchant</span>
<div class="relative">
<select class="w-full h-12 rounded-lg border-slate-200 dark:border-slate-700 bg-background-light dark:bg-slate-800 text-slate-900 dark:text-white pl-4 pr-10 focus:border-primary focus:ring-primary appearance-none transition-colors">
<option disabled="" selected="" value="">Search for a merchant...</option>
<option value="1">Grain Valley Co-op</option>
<option value="2">Sunny Side Fields</option>
<option value="3">Riverbend Mills</option>
</select>
<div class="absolute inset-y-0 right-3 flex items-center pointer-events-none text-slate-500">
<span class="material-symbols-outlined text-xl">expand_more</span>
</div>
</div>
</label>
<!-- Production Date Field -->
<label class="block group">
<span class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">Production Date</span>
<div class="relative flex items-center">
<input class="w-full h-12 rounded-lg border-slate-200 dark:border-slate-700 bg-background-light dark:bg-slate-800 text-slate-900 dark:text-white pl-4 pr-10 focus:border-primary focus:ring-primary transition-colors [color-scheme:light] dark:[color-scheme:dark]" type="date" value="2023-10-24"/>
<div class="absolute inset-y-0 right-3 flex items-center pointer-events-none text-slate-500">
<span class="material-symbols-outlined text-xl">calendar_month</span>
</div>
</div>
</label>
</div>
</div>
<!-- Production Outputs Section -->
<div class="px-4 pb-6">
<div class="flex items-center justify-between mb-4">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary">inventory_2</span>
<h2 class="text-lg font-bold">Production Outputs</h2>
</div>
<span class="text-xs font-medium px-2 py-1 bg-primary/10 text-primary rounded-full">2 Items</span>
</div>
<div class="space-y-4">
<!-- Output Item Card 1 -->
<div class="bg-white dark:bg-[#1A2632] rounded-xl shadow-sm border border-slate-200 dark:border-slate-800 p-4 relative group">
<div class="flex justify-between items-start mb-3">
<h3 class="text-sm font-semibold text-slate-900 dark:text-white">Output #1</h3>
<button class="text-slate-400 hover:text-red-500 transition-colors p-1 -mr-2 -mt-2">
<span class="material-symbols-outlined text-xl">delete</span>
</button>
</div>
<div class="grid grid-cols-2 gap-4">
<label class="col-span-2">
<span class="block text-xs font-medium text-slate-500 mb-1">Item Type</span>
<div class="relative">
<select class="w-full h-10 rounded-lg border-slate-200 dark:border-slate-700 bg-background-light dark:bg-slate-800 text-sm pl-3 pr-8 focus:border-primary focus:ring-primary appearance-none">
<option selected="" value="jasmine">Jasmine Rice - Grade A</option>
<option value="basmati">Basmati Rice</option>
<option value="brown">Brown Rice</option>
</select>
<span class="absolute right-2 top-2.5 pointer-events-none text-slate-500 material-symbols-outlined text-lg">expand_more</span>
</div>
</label>
<label>
<span class="block text-xs font-medium text-slate-500 mb-1">Bags</span>
<div class="relative">
<input class="w-full h-10 rounded-lg border-slate-200 dark:border-slate-700 bg-background-light dark:bg-slate-800 text-sm pl-3 focus:border-primary focus:ring-primary" placeholder="0" type="number" value="50"/>
<span class="absolute right-3 top-2.5 text-xs text-slate-400 font-medium">qty</span>
</div>
</label>
<label>
<span class="block text-xs font-medium text-slate-500 mb-1">Loose Lbs</span>
<div class="relative">
<input class="w-full h-10 rounded-lg border-slate-200 dark:border-slate-700 bg-background-light dark:bg-slate-800 text-sm pl-3 focus:border-primary focus:ring-primary" placeholder="0.0" type="number" value="12"/>
<span class="absolute right-3 top-2.5 text-xs text-slate-400 font-medium">lbs</span>
</div>
</label>
</div>
</div>
<!-- Output Item Card 2 (Error State) -->
<div class="bg-white dark:bg-[#1A2632] rounded-xl shadow-sm border border-red-200 dark:border-red-900/30 ring-1 ring-red-100 dark:ring-red-900/20 p-4 relative">
<div class="flex justify-between items-start mb-3">
<h3 class="text-sm font-semibold text-slate-900 dark:text-white">Output #2</h3>
<button class="text-slate-400 hover:text-red-500 transition-colors p-1 -mr-2 -mt-2">
<span class="material-symbols-outlined text-xl">delete</span>
</button>
</div>
<div class="grid grid-cols-2 gap-4">
<label class="col-span-2">
<span class="block text-xs font-medium text-slate-500 mb-1">Item Type</span>
<div class="relative">
<select class="w-full h-10 rounded-lg border-slate-200 dark:border-slate-700 bg-background-light dark:bg-slate-800 text-sm pl-3 pr-8 focus:border-primary focus:ring-primary appearance-none">
<option value="jasmine">Jasmine Rice - Grade A</option>
<option selected="" value="broken">Broken Rice</option>
<option value="brown">Brown Rice</option>
</select>
<span class="absolute right-2 top-2.5 pointer-events-none text-slate-500 material-symbols-outlined text-lg">expand_more</span>
</div>
</label>
<label>
<span class="block text-xs font-medium text-red-600 dark:text-red-400 mb-1 flex items-center gap-1">
                                Bags
                                <span class="material-symbols-outlined text-[14px] fill-current">error</span>
</span>
<div class="relative">
<input class="w-full h-10 rounded-lg border-red-500 bg-red-50 dark:bg-red-900/10 text-red-900 dark:text-red-100 text-sm pl-3 focus:border-red-500 focus:ring-red-500 placeholder:text-red-300" placeholder="0" type="number"/>
<span class="absolute right-3 top-2.5 text-xs text-red-400 font-medium">qty</span>
</div>
<span class="text-xs text-red-600 dark:text-red-400 mt-1 block">Quantity required</span>
</label>
<label>
<span class="block text-xs font-medium text-slate-500 mb-1">Loose Lbs</span>
<div class="relative">
<input class="w-full h-10 rounded-lg border-slate-200 dark:border-slate-700 bg-background-light dark:bg-slate-800 text-sm pl-3 focus:border-primary focus:ring-primary" placeholder="0.0" type="number" value="0"/>
<span class="absolute right-3 top-2.5 text-xs text-slate-400 font-medium">lbs</span>
</div>
</label>
</div>
</div>
<!-- Add Button -->
<button class="w-full py-3 rounded-xl border-2 border-dashed border-primary/30 bg-primary/5 hover:bg-primary/10 text-primary font-semibold text-sm flex items-center justify-center gap-2 transition-all active:scale-[0.98]" type="button">
<span class="material-symbols-outlined text-xl">add_circle</span>
                    Add Output Item
                </button>
</div>
</div>
</main>
<!-- Sticky Bottom Actions -->
<div class="fixed bottom-0 left-0 w-full bg-white dark:bg-[#101922] border-t border-slate-200 dark:border-slate-800 p-4 pb-8 z-40">
<div class="max-w-lg mx-auto flex gap-3">
<button class="flex-1 py-3.5 px-4 rounded-xl text-slate-700 dark:text-slate-300 font-semibold text-base bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors" type="button">
                Cancel
            </button>
<button class="flex-[2] py-3.5 px-4 rounded-xl text-white font-semibold text-base bg-primary hover:bg-blue-600 shadow-lg shadow-primary/30 transition-all flex items-center justify-center gap-2 active:scale-[0.98]" type="submit">
<span class="material-symbols-outlined">save</span>
                Save Batch
            </button>
</div>
</div>
</body></html>
