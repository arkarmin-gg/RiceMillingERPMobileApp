<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Inventory Empty State</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#137fec",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101922",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
                },
            },
        }
    </script>
<style>
        /* Custom scrollbar hide for cleaner mobile look */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 antialiased">
<div class="relative flex h-full min-h-screen w-full flex-col overflow-hidden bg-white dark:bg-background-dark mx-auto max-w-md shadow-xl sm:rounded-xl sm:my-8 sm:h-[800px] border-x border-slate-100 dark:border-slate-800">
<!-- Header -->
<div class="flex items-center justify-between border-b border-slate-100 dark:border-slate-800 bg-white dark:bg-background-dark p-4 pb-3 pt-12 sticky top-0 z-10">
<div class="flex items-center gap-3">
<button class="flex h-10 w-10 items-center justify-center rounded-full hover:bg-slate-50 dark:hover:bg-slate-800 text-slate-900 dark:text-white transition-colors">
<span class="material-symbols-outlined text-2xl">arrow_back</span>
</button>
<h1 class="text-xl font-bold leading-tight tracking-tight text-slate-900 dark:text-white">Stock Balances</h1>
</div>
<div class="flex items-center gap-2">
<button class="relative flex h-10 w-10 items-center justify-center rounded-full bg-primary/10 text-primary hover:bg-primary/20 transition-colors">
<span class="material-symbols-outlined text-2xl">filter_list</span>
<span class="absolute top-2 right-2 h-2 w-2 rounded-full bg-primary ring-2 ring-white dark:ring-background-dark"></span>
</button>
</div>
</div>
<!-- Main Content: Empty State -->
<div class="flex flex-1 flex-col items-center justify-center px-6 py-10">
<div class="flex w-full max-w-[320px] flex-col items-center gap-8 text-center">
<!-- Illustration -->
<div class="relative flex h-48 w-48 items-center justify-center rounded-full bg-primary/5 dark:bg-primary/10">
<div class="absolute inset-0 rounded-full border border-dashed border-primary/30"></div>
<!-- Replaced simple background div with an abstract icon composition representing empty warehouse/clipboard -->
<div class="relative z-10 text-primary/40">
<span class="material-symbols-outlined" style="font-size: 80px;">inventory_2</span>
</div>
<div class="absolute -right-2 top-10 flex h-12 w-12 items-center justify-center rounded-full bg-white dark:bg-slate-800 shadow-lg ring-4 ring-white dark:ring-background-dark">
<span class="material-symbols-outlined text-red-400 text-2xl">search_off</span>
</div>
</div>
<!-- Text Content -->
<div class="flex flex-col gap-3">
<h2 class="text-2xl font-bold tracking-tight text-slate-900 dark:text-white">No stock records found</h2>
<p class="text-base font-normal leading-relaxed text-slate-500 dark:text-slate-400">
                        We couldn't find any inventory matching your current filters. Try adjusting them or add a new batch.
                    </p>
</div>
<!-- Actions -->
<div class="flex w-full flex-col gap-3 pt-4">
<button class="flex h-12 w-full items-center justify-center gap-2 rounded-lg bg-primary px-6 text-base font-bold text-white shadow-lg shadow-primary/20 transition-transform active:scale-95 hover:bg-blue-600">
<span class="material-symbols-outlined text-xl">refresh</span>
<span>Reset Filters</span>
</button>
<button class="flex h-12 w-full items-center justify-center gap-2 rounded-lg bg-transparent px-6 text-base font-medium text-primary hover:bg-primary/5 transition-colors">
<span class="material-symbols-outlined text-xl">add</span>
<span>Add Production Batch</span>
</button>
</div>
</div>
</div>
<!-- Bottom Navigation -->
<div class="border-t border-slate-100 dark:border-slate-800 bg-white dark:bg-background-dark px-4 pb-8 pt-2">
<div class="flex justify-between">
<a class="flex flex-1 flex-col items-center justify-center gap-1 rounded-lg py-2 text-slate-400 dark:text-slate-500 hover:bg-slate-50 dark:hover:bg-slate-800/50 transition-colors" href="#">
<span class="material-symbols-outlined text-2xl">dashboard</span>
<span class="text-[10px] font-medium tracking-wide">Dashboard</span>
</a>
<a class="flex flex-1 flex-col items-center justify-center gap-1 rounded-lg py-2 text-primary" href="#">
<span class="material-symbols-outlined text-2xl fill-1">inventory_2</span>
<span class="text-[10px] font-medium tracking-wide">Inventory</span>
</a>
<div class="relative -top-8 flex flex-1 justify-center">
<button class="flex h-14 w-14 items-center justify-center rounded-full bg-primary text-white shadow-xl shadow-primary/30 ring-4 ring-white dark:ring-background-dark transition-transform active:scale-90 hover:bg-blue-600">
<span class="material-symbols-outlined text-3xl">qr_code_scanner</span>
</button>
</div>
<a class="flex flex-1 flex-col items-center justify-center gap-1 rounded-lg py-2 text-slate-400 dark:text-slate-500 hover:bg-slate-50 dark:hover:bg-slate-800/50 transition-colors" href="#">
<span class="material-symbols-outlined text-2xl">factory</span>
<span class="text-[10px] font-medium tracking-wide">Production</span>
</a>
<a class="flex flex-1 flex-col items-center justify-center gap-1 rounded-lg py-2 text-slate-400 dark:text-slate-500 hover:bg-slate-50 dark:hover:bg-slate-800/50 transition-colors" href="#">
<span class="material-symbols-outlined text-2xl">shopping_cart</span>
<span class="text-[10px] font-medium tracking-wide">Orders</span>
</a>
</div>
</div>
</div>
</body></html>
