<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>RiceMill ERP Login</title>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Theme Configuration -->
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#137fec",
              "background-light": "#f6f7f8",
              "background-dark": "#101922",
            },
            fontFamily: {
              "display": ["Inter", "sans-serif"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Custom scrollbar hiding for cleaner mobile look */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark min-h-screen flex flex-col items-center justify-center font-display text-slate-900 dark:text-slate-100 antialiased overflow-hidden relative">
<!-- Main Container -->
<div class="w-full max-w-md bg-white dark:bg-[#1A2632] h-full min-h-screen sm:min-h-0 sm:h-auto sm:rounded-2xl shadow-none sm:shadow-xl relative flex flex-col">
<!-- Header Section -->
<div class="flex flex-col items-center pt-12 pb-6 px-8">
<div class="w-20 h-20 bg-primary/10 rounded-2xl flex items-center justify-center mb-6 shadow-sm border border-primary/20">
<span class="material-symbols-outlined text-primary text-4xl">agriculture</span>
</div>
<h1 class="text-2xl font-bold text-slate-900 dark:text-white tracking-tight text-center">RiceMill ERP</h1>
<p class="text-slate-500 dark:text-slate-400 text-sm mt-2 text-center font-medium">Production Management System</p>
</div>
<!-- Login Form -->
<div class="px-8 pb-8 flex-1 flex flex-col">
<h2 class="text-xl font-bold mb-6 text-slate-900 dark:text-white">Sign In</h2>
<form class="flex flex-col gap-5" onsubmit="event.preventDefault();">
<!-- Email/Phone Field -->
<div class="flex flex-col gap-1.5">
<label class="text-sm font-semibold text-slate-700 dark:text-slate-300" for="identity">Email or Phone</label>
<div class="relative group">
<div class="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined text-[20px]">person</span>
</div>
<input class="w-full pl-11 pr-4 py-3.5 bg-slate-50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-primary/20 focus:border-primary text-slate-900 dark:text-white placeholder:text-slate-400 transition-all outline-none font-medium" id="identity" placeholder="Enter email or phone number" type="text"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-1.5">
<label class="text-sm font-semibold text-slate-700 dark:text-slate-300" for="password">Password</label>
<div class="relative group">
<div class="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined text-[20px]">lock</span>
</div>
<input class="w-full pl-11 pr-12 py-3.5 bg-slate-50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-primary/20 focus:border-primary text-slate-900 dark:text-white placeholder:text-slate-400 transition-all outline-none font-medium" id="password" placeholder="Enter password" type="password"/>
<button class="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition-colors p-1 rounded-full hover:bg-slate-100 dark:hover:bg-slate-700 flex items-center justify-center" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
</div>
<!-- Spacer -->
<div class="h-2"></div>
<!-- Login Button -->
<button class="w-full bg-primary hover:bg-blue-600 text-white font-bold text-base py-4 rounded-xl shadow-lg shadow-primary/30 active:scale-[0.98] transition-all flex items-center justify-center gap-2" type="submit">
<span>Log In</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
<!-- Forgot Password -->
<button class="w-full text-center mt-2 group" type="button">
<span class="text-sm font-medium text-slate-500 dark:text-slate-400 group-hover:text-primary transition-colors">Forgot Password?</span>
</button>
</form>
<div class="flex-1"></div>
<!-- Version Info -->
<p class="text-center text-xs text-slate-400 dark:text-slate-600 mt-8 mb-4">RiceMill ERP v2.4.0</p>
</div>
</div>
<!-- Error Toast (Simulated visibility for demo) -->
<div class="fixed bottom-6 left-1/2 -translate-x-1/2 w-[90%] max-w-sm z-50 animate-[slideUp_0.3s_ease-out]">
<div class="bg-red-600 text-white px-4 py-3 rounded-lg shadow-xl flex items-center gap-3 border border-red-700">
<span class="material-symbols-outlined">error</span>
<div class="flex flex-col">
<span class="text-sm font-bold">Login Failed</span>
<span class="text-xs text-red-100">Invalid credentials, please try again.</span>
</div>
<button class="ml-auto text-white/70 hover:text-white">
<span class="material-symbols-outlined text-sm">close</span>
</button>
</div>
</div>
<style>
        @keyframes slideUp {
            from { transform: translate(-50%, 100%); opacity: 0; }
            to { transform: translate(-50%, 0); opacity: 1; }
        }
    </style>
</body></html>
