<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>User Profile - Rice Mill ERP</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#137fec",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101922",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "2xl": "1rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 antialiased min-h-screen flex flex-col overflow-hidden">
<!-- Top Navigation / Header -->
<header class="flex items-center justify-between px-4 py-3 bg-white dark:bg-gray-800 border-b border-gray-100 dark:border-gray-700 sticky top-0 z-10">
<button class="p-2 -ml-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-700 text-slate-600 dark:text-slate-300 transition-colors">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="text-lg font-bold text-slate-900 dark:text-white">Profile</h1>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<!-- Main Content Area -->
<main class="flex-1 overflow-y-auto px-4 pb-24">
<!-- Profile Header Section -->
<div class="flex flex-col items-center pt-8 pb-6">
<div class="relative group cursor-pointer">
<!-- Avatar with subtle primary ring -->
<div class="w-28 h-28 rounded-full p-1 bg-white dark:bg-gray-800 ring-2 ring-primary/20 dark:ring-primary/40">
<img alt="Profile picture of a male user looking confident" class="w-full h-full rounded-full object-cover" data-alt="Close up portrait of a smiling man with a beard wearing a white shirt" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBE8A7evMXi_g-XSXxPwem-iI0XQ19Cr5TZ2LizzL-2Iyl99QWVHvcpPGe1AaIVkSROUaYcQ5XgXSvTngDUKvN-9GyxTCN957Rz8hAWIy5AYhdFak8jEKoV-9ocAhKWv-ZNKxFZMM1PAyEHRicP0HXQgop9Zx7rsilgFCP6D-zRdneb5JcF3e7FAWo2BEmYlf7Omlz7JkQCt4u2eqWDmgqzdaK3NoC_n1KMOUMbEUErtlKiIGs-2opCGxwM0mzMI4m9Yr3XUEOHfDN0"/>
</div>
<!-- Edit badge -->
<button class="absolute bottom-1 right-1 bg-primary text-white p-1.5 rounded-full shadow-lg border-2 border-white dark:border-gray-800 flex items-center justify-center hover:bg-blue-600 transition-colors">
<span class="material-symbols-outlined text-[16px] leading-none">edit</span>
</button>
</div>
<h2 class="mt-4 text-2xl font-bold text-slate-900 dark:text-white">John Doe</h2>
<!-- User Role Badge -->
<div class="mt-2 px-3 py-1 bg-primary/10 dark:bg-primary/20 rounded-full flex items-center gap-1.5">
<span class="material-symbols-outlined text-primary text-[16px]">verified_user</span>
<span class="text-xs font-semibold text-primary tracking-wide uppercase">Admin</span>
</div>
<!-- Contact Info -->
<div class="mt-3 text-center space-y-1">
<p class="text-slate-500 dark:text-slate-400 text-sm">john.doe@ricemill.com</p>
<p class="text-slate-500 dark:text-slate-400 text-sm">+1 (555) 019-2834</p>
</div>
</div>
<!-- Action Menu Group (iOS Inset Style) -->
<div class="mt-4 space-y-6 max-w-md mx-auto w-full">
<!-- Account Settings Group -->
<div class="bg-white dark:bg-gray-800 rounded-xl overflow-hidden shadow-sm border border-gray-100 dark:border-gray-700">
<h3 class="px-4 pt-4 pb-2 text-xs font-semibold text-slate-400 uppercase tracking-wider">Account</h3>
<a class="flex items-center gap-4 p-4 hover:bg-gray-50 dark:hover:bg-gray-750 transition-colors active:bg-gray-100 dark:active:bg-gray-700 group border-b border-gray-50 dark:border-gray-700/50 last:border-0" href="#">
<div class="w-10 h-10 rounded-lg bg-blue-50 dark:bg-blue-900/20 flex items-center justify-center text-primary">
<span class="material-symbols-outlined">settings</span>
</div>
<div class="flex-1">
<p class="text-slate-900 dark:text-white font-medium text-base group-hover:text-primary transition-colors">Settings</p>
</div>
<span class="material-symbols-outlined text-slate-400">chevron_right</span>
</a>
<a class="flex items-center gap-4 p-4 hover:bg-gray-50 dark:hover:bg-gray-750 transition-colors active:bg-gray-100 dark:active:bg-gray-700 group" href="#">
<div class="w-10 h-10 rounded-lg bg-emerald-50 dark:bg-emerald-900/20 flex items-center justify-center text-emerald-600 dark:text-emerald-400">
<span class="material-symbols-outlined">help</span>
</div>
<div class="flex-1">
<p class="text-slate-900 dark:text-white font-medium text-base group-hover:text-primary transition-colors">Help &amp; Support</p>
</div>
<span class="material-symbols-outlined text-slate-400">chevron_right</span>
</a>
</div>
<!-- Danger Zone / Logout -->
<div class="bg-white dark:bg-gray-800 rounded-xl overflow-hidden shadow-sm border border-gray-100 dark:border-gray-700">
<button class="w-full flex items-center gap-4 p-4 hover:bg-red-50 dark:hover:bg-red-900/10 transition-colors active:bg-red-100 dark:active:bg-red-900/20 group">
<div class="w-10 h-10 rounded-lg bg-red-50 dark:bg-red-900/20 flex items-center justify-center text-red-600 dark:text-red-400">
<span class="material-symbols-outlined">logout</span>
</div>
<div class="flex-1 text-left">
<p class="text-red-600 dark:text-red-400 font-semibold text-base">Log Out</p>
</div>
</button>
</div>
<div class="text-center pt-2">
<p class="text-xs text-slate-400 dark:text-slate-600">App Version 2.4.0 (Build 302)</p>
</div>
</div>
</main>
<!-- Bottom Navigation Bar -->
<nav class="fixed bottom-0 left-0 right-0 bg-white dark:bg-gray-800 border-t border-gray-200 dark:border-gray-700 pb-safe pt-2 px-2 z-50">
<div class="flex justify-around items-end w-full max-w-md mx-auto pb-4"> <!-- pb-4 accounts for safe area on bottom roughly -->
<a class="flex flex-1 flex-col items-center gap-1 group" href="#">
<span class="material-symbols-outlined text-slate-400 group-hover:text-primary transition-colors">dashboard</span>
<span class="text-[10px] font-medium text-slate-500 group-hover:text-primary">Dashboard</span>
</a>
<a class="flex flex-1 flex-col items-center gap-1 group" href="#">
<span class="material-symbols-outlined text-slate-400 group-hover:text-primary transition-colors">inventory_2</span>
<span class="text-[10px] font-medium text-slate-500 group-hover:text-primary">Inventory</span>
</a>
<!-- FAB / Main Action (Optional central button often seen in ERPs) -->
<div class="relative -top-5">
<button class="flex items-center justify-center w-14 h-14 bg-primary rounded-full shadow-lg shadow-blue-500/30 text-white hover:scale-105 transition-transform">
<span class="material-symbols-outlined text-2xl">add</span>
</button>
</div>
<a class="flex flex-1 flex-col items-center gap-1 group" href="#">
<span class="material-symbols-outlined text-slate-400 group-hover:text-primary transition-colors">factory</span>
<span class="text-[10px] font-medium text-slate-500 group-hover:text-primary">Production</span>
</a>
<a class="flex flex-1 flex-col items-center gap-1 group" href="#">
<span class="material-symbols-outlined text-primary fill-current">person</span>
<span class="text-[10px] font-medium text-primary">Profile</span>
</a>
</div>
</nav>
</body></html>
